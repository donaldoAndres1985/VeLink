name: velink
description: "Tu segunda memoria digital — guarda, organiza y redescubre links."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Base de datos local
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Estado global
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # HTTP y scraping OG
  dio: ^5.4.0
  html: ^0.15.0

  # Imágenes
  cached_network_image: ^3.3.0
  image_picker: ^1.1.0

  # Captura via Share Sheet (Android + iOS)
  receive_sharing_intent: ^1.8.0

  # Notificaciones locales
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^3.0.0
  timezone: ^0.9.0

  # Preferencias locales
  shared_preferences: ^2.2.0

  # Utilidades
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generadores de código
  drift_dev: ^2.22.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0

  # Testing
  mocktail: ^0.3.0

flutter:
  uses-material-design: true
